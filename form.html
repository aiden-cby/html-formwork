<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>個人報名 Individual Registration</title>

    <!-- reset -->
    <link rel="stylesheet" href="reset.css" />

    <!-- 自己的 CSS -->
    <link rel="stylesheet" href="form.css" />
  </head>

  <body>
    <div class="container">
      <!-- 頁面標題 -->
      <header class="page-header">
        <h1>個人報名 Individual Registration</h1>
      </header>

      <form>
        <!-- =========================
           基本資料
      ========================== -->
        <section class="form-section">
          <h2 class="section-title">基本資料 / Basic Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="name"> 姓名 / Name <span>*</span> </label>

              <input type="text" id="name" placeholder="請輸入姓名" />
            </div>

            <div class="form-group">
              <label> 性別 / Gender </label>

              <div class="option-group">
                <label class="option">
                  <input type="radio" name="gender" value="male" />
                  男 / male
                </label>

                <label class="option">
                  <input type="radio" name="gender" value="female" />
                  女 / female
                </label>
              </div>
            </div>

            <div class="form-group full">
              <label> 國籍 / Nationality </label>

              <div class="option-group">
                <label class="option">
                  <input type="radio" name="nationality" value="roc" checked />
                  本國國籍 / ROC Citizens
                </label>

                <label class="option">
                  <input type="radio" name="nationality" value="foreign" />
                  外國國籍 / Non-Citizens
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="id-number">
                身分證號 / ID Number <span>*</span>
              </label>

              <input
                type="text"
                id="id-number"
                placeholder="身分證或護照號碼"
              />
            </div>

            <div class="form-group">
              <label> 出生日期 / Date Of Birth </label>

              <div class="date-group">
                <select>
                  <option>年 Year</option>
                  <option>1990</option>
                  <option>1991</option>
                  <option>1992</option>
                  <option>1993</option>
                  <option>1994</option>
                  <option>1995</option>
                  <option>1996</option>
                  <option>1997</option>
                  <option>1998</option>
                  <option>1999</option>
                  <option>2000</option>
                </select>

                <select>
                  <option>月 Month</option>
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                  <option>5</option>
                  <option>6</option>
                  <option>7</option>
                  <option>8</option>
                  <option>9</option>
                  <option>10</option>
                  <option>11</option>
                  <option>12</option>
                </select>

                <select>
                  <option>日 Day</option>
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                  <option>5</option>
                  <option>6</option>
                  <option>7</option>
                  <option>8</option>
                  <option>9</option>
                  <option>10</option>
                  <option>11</option>
                  <option>12</option>
                  <option>13</option>
                  <option>14</option>
                  <option>15</option>
                  <option>16</option>
                  <option>17</option>
                  <option>18</option>
                  <option>19</option>
                  <option>20</option>
                  <option>21</option>
                  <option>22</option>
                  <option>23</option>
                  <option>24</option>
                  <option>25</option>
                  <option>26</option>
                  <option>27</option>
                  <option>28</option>
                  <option>29</option>
                  <option>30</option>
                  <option>31</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="email"> 電子信箱 / Email <span>*</span> </label>

              <input type="email" id="email" placeholder="example@mail.com" />
            </div>

            <div class="form-group full">
              <label> 聯絡電話 / Contact Number </label>

              <div class="phone-group">
                <div>
                  <span>手機 / Mobile</span>
                  <input type="text" value="0922053012" />
                </div>

                <div>
                  <span>住家 / Home</span>
                  <input type="text" value="0225855659" />
                </div>

                <div>
                  <span>公司 / Office</span>
                  <input type="text" />
                </div>
              </div>
            </div>

            <div class="form-group full">
              <label> 通訊地址 / Mailing Address </label>

              <div class="address-group">
                <select>
                  <option>請選擇縣市別 County/City</option>
                </select>

                <select>
                  <option>請選擇鄉鎮區別 Township</option>
                </select>

                <input
                  type="text"
                  placeholder="郵遞區號 例如：昌吉街55號2樓206室"
                />
              </div>
            </div>

            <div class="form-group full">
              <label> 緊急聯絡人姓名 / Name of Emergency Contact </label>

              <div class="emergency-group">
                <div>
                  <span>姓名</span>
                  <input type="text" />
                </div>

                <div>
                  <span>關係 / Relationship</span>
                  <input type="text" />
                </div>

                <div>
                  <span>電話 / Phone</span>
                  <input type="text" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- =========================
           競賽項目
      ========================== -->
        <section class="form-section">
          <h2 class="section-title">
            競賽項目資料 / Race Category Information
          </h2>

          <div class="race-list">
            <div class="race-item">
              <label class="race-check">
                <input type="checkbox" name="race" value="9km" />

                <span>9KM</span>
                <strong>NTD 800</strong>
              </label>

              <select>
                <option>請選擇衣服尺寸</option>
                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
              </select>
            </div>

            <div class="race-item">
              <label class="race-check">
                <input type="checkbox" name="race" value="3km" />

                <span>3KM</span>
                <strong>NTD 650</strong>
              </label>

              <select>
                <option>請選擇衣服尺寸</option>
                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
              </select>
            </div>
          </div>
        </section>

        <!-- =========================
           報到方式
      ========================== -->
        <section class="form-section">
          <h2 class="section-title">報到方式(二擇一) / Check-in Method</h2>

          <div class="checkin-group">
            <div class="checkin-item">
              <label> 郵寄代理報到 / Postal delivery check-in </label>

              <div class="option-group">
                <label class="option">
                  <input type="radio" name="postal" value="yes" />
                  是 / Y
                </label>

                <label class="option">
                  <input type="radio" name="postal" value="no" checked />
                  否 / N
                </label>
              </div>
            </div>

            <div class="location-box">
              <label class="location-radio">
                <input type="radio" name="location" checked />

                <span> 地點：花博爭艷館（臺北市中山區玉門街1號） </span>
              </label>

              <div class="time-group">
                <span>時間：</span>

                <input type="date" value="2026-12-17" />

                <span>～</span>

                <input type="date" value="2026-12-18" />
              </div>
            </div>
          </div>
        </section>

        <!-- =========================
           其他
      ========================== -->
        <section class="form-section">
          <h2 class="section-title">其他 / Others</h2>

          <div class="other-list">
            <div class="form-group">
              <label for="website">
                個人網站 / Website
                <small>（選填）</small>
              </label>

              <input type="url" id="website" placeholder="https://" />
            </div>

            <div class="form-group">
              <label for="note"> 備註 / Note </label>

              <textarea
                id="note"
                rows="5"
                placeholder="如有特殊需求請於此說明"
              ></textarea>
            </div>

            <div class="form-group">
              <label for="photo"> 上傳證件照 / Upload Photo </label>

              <input type="file" id="photo" />
            </div>
          </div>
        </section>

        <!-- =========================
           按鈕
      ========================== -->
        <div class="button-area">
          <button type="submit" class="submit-btn">送出報名</button>

          <button type="reset" class="reset-btn">清除重填</button>
        </div>
      </form>
    </div>
  </body>
</html>
